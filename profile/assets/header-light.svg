<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="0.5" stop-color="#67e8f9"/><stop offset="1" stop-color="#f9a8d4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="frame"><rect width="960" height="360" rx="24"/></clipPath>
    <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:18px}
      .t{font-size:13px;fill:#64748b}</style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="360" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.75">
      <circle r="130" fill="#a78bfa" cx="180" cy="90"><animate attributeName="cx" values="180;320;180" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="90;220;90" dur="11s" repeatCount="indefinite"/></circle>
      <circle r="120" fill="#67e8f9" cx="780" cy="260"><animate attributeName="cx" values="780;620;780" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="260;120;260" dur="9s" repeatCount="indefinite"/></circle>
      <circle r="100" fill="#f9a8d4" cx="520" cy="40"><animate attributeName="cx" values="520;700;520" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="40;160;40" dur="12s" repeatCount="indefinite"/></circle>
    </g>
    <!-- glass terminal -->
    <rect x="40" y="36" width="880" height="288" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#0f172a" stroke-opacity="0.08"/>
    <rect x="40" y="36" width="880" height="40" rx="18" fill="#0f172a" fill-opacity="0.03"/>
    <rect x="40" y="75" width="880" height="1.5" fill="url(#edge)" opacity="0.9"/>
    <circle cx="68" cy="56" r="6.5" fill="#ff5f57"/><circle cx="90" cy="56" r="6.5" fill="#febc2e"/><circle cx="112" cy="56" r="6.5" fill="#28c840"/>
    <text x="480" y="61" text-anchor="middle" class="t">innoo47@github: ~/profile</text>
    
  <clipPath id="c0"><rect x="76" y="98" height="28" width="0">
    <animate attributeName="width" from="0" to="107" begin="0.6s" dur="0.7s" fill="freeze"/></rect></clipPath>
  <text x="80" y="118" clip-path="url(#c0)" xml:space="preserve"><tspan fill="#0891b2">$ </tspan><tspan fill="#0f172a">whoami</tspan></text>
  <clipPath id="c1"><rect x="76" y="130" height="28" width="0">
    <animate attributeName="width" from="0" to="445" begin="1.6s" dur="0.5s" fill="freeze"/></rect></clipPath>
  <text x="80" y="150" clip-path="url(#c1)" xml:space="preserve"><tspan fill="#7c3aed">innoo47</tspan><tspan fill="#64748b"> · backend developer in progress</tspan></text>
  <clipPath id="c2"><rect x="76" y="162" height="28" width="0">
    <animate attributeName="width" from="0" to="173" begin="2.6s" dur="0.8s" fill="freeze"/></rect></clipPath>
  <text x="80" y="182" clip-path="url(#c2)" xml:space="preserve"><tspan fill="#0891b2">$ </tspan><tspan fill="#0f172a">cat ./now.md</tspan></text>
  <clipPath id="c3"><rect x="76" y="194" height="28" width="0">
    <animate attributeName="width" from="0" to="489" begin="3.7s" dur="0.6s" fill="freeze"/></rect></clipPath>
  <text x="80" y="214" clip-path="url(#c3)" xml:space="preserve"><tspan fill="#64748b">→ building  </tspan><tspan fill="#db2777">Dev in</tspan><tspan fill="#0f172a">  developer Q&amp;A community</tspan></text>
  <clipPath id="c4"><rect x="76" y="226" height="28" width="0">
    <animate attributeName="width" from="0" to="510" begin="4.5s" dur="0.6s" fill="freeze"/></rect></clipPath>
  <text x="80" y="246" clip-path="url(#c4)" xml:space="preserve"><tspan fill="#64748b">→ leading   </tspan><tspan fill="#db2777">team 3</tspan><tspan fill="#0f172a">  @ LIKELION backend school</tspan></text>
  <clipPath id="c5"><rect x="76" y="258" height="28" width="0">
    <animate attributeName="width" from="0" to="434" begin="5.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
  <text x="80" y="278" clip-path="url(#c5)" xml:space="preserve"><tspan fill="#64748b">→ learning  </tspan><tspan fill="#0f172a">Spring · JPA · React · JWT</tspan></text>
    <text x="80" y="310" opacity="0"><tspan fill="#0891b2">$ </tspan><tspan fill="#0f172a">█</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.5;0.51" dur="1s" begin="6.2s" repeatCount="indefinite"/></text>
  </g>
</svg>